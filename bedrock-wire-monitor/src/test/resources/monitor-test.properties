# === Test Monitor Configuration ===
# Global defaults
monitor.default.interval=30s
monitor.default.retry.count=1
monitor.default.retry.delay=2s
monitor.default.validation.validators=httpStatus
monitor.default.header.Accept=application/xml
monitor.default.header.X-Client-Id=bedrock-monitor-test
# TLS profiles
monitor.tls.test-tls.trustStore=/certs/test-truststore.p12
monitor.tls.test-tls.trustStorePassword=testpass
monitor.tls.test-tls.trustStoreType=PKCS12
# Services
monitor.service.testService.url=https://test.example.com
monitor.service.testService.header.Content-Type=application/xml
monitor.service.testService.transport.responseTimeout=10s
monitor.service.testService.transport.connectionTimeout=3s
monitor.service.slowService.url=https://slow.example.com
monitor.service.slowService.interval=60s
monitor.service.slowService.transport.responseTimeout=15s
monitor.service.slowService.transport.connectionTimeout=3s
# Checks
monitor.check.healthCheck.service=testService
monitor.check.healthCheck.method=POST
monitor.check.healthCheck.path=/api/health
monitor.check.healthCheck.templateFile=src/test/resources/templates/health-check.xml
monitor.check.healthCheck.param.clientId=test-client
monitor.check.healthCheck.param.region=test-region
monitor.check.healthCheck.validation.validators=httpStatus,contains
monitor.check.healthCheck.validation.httpStatus=200
monitor.check.healthCheck.validation.contains=<status>OK</status>
monitor.check.pingCheck.service=testService
monitor.check.pingCheck.method=GET
monitor.check.pingCheck.path=/ping
monitor.check.pingCheck.interval=10s
monitor.check.pingCheck.retry.count=0
monitor.check.pingCheck.validation.validators=httpStatus
monitor.check.pingCheck.validation.httpStatus=200
monitor.check.slowCheck.service=slowService
monitor.check.slowCheck.method=POST
monitor.check.slowCheck.path=/api/process
monitor.check.slowCheck.query=format=xml
monitor.check.slowCheck.validation.validators=httpStatus,maxDuration
monitor.check.slowCheck.validation.httpStatus=200
monitor.check.slowCheck.validation.maxDuration=8s
# Shutdown
monitor.executor.shutdownTimeout=10s
